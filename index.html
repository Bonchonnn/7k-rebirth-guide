<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seven Knights Rebirth - Guide & Wiki</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-dark text-light">

    <!-- Header / Navbar -->
    <header class="bg-secondary bg-gradient text-center py-4 border-bottom border-warning shadow-sm">
        <div class="container">
            <h1 class="text-warning fw-bold display-5">Seven Knights Rebirth Guide</h1>
            <p class="m-0 text-light lead">คลังข้อมูลตัวละคร สกิล และไกด์เกมภาษาไทย</p>
        </div>
    </header>

    <main class="container my-5">
        <!-- แถบค้นหาและตัวกรอง (Search & Filter) -->
        <section class="row g-3 mb-4 p-3 bg-secondary rounded shadow-sm border border-secondary-subtle">
            <div class="col-md-7">
                <input type="text" id="searchInput" class="form-control bg-dark text-light border-secondary shadow-none" placeholder="🔍 ค้นหาชื่อตัวละคร...">
            </div>
            <div class="col-md-5">
               <section class="mb-4 text-center">
    <div class="row g-2 align-items-center mb-3">
        <div class="col-md-6">
            <input type="text" id="searchInput" class="form-control bg-dark text-light border-secondary shadow-none" placeholder="🔍 ค้นหาชื่อตัวละคร...">
        </div>
        <div class="col-md-6 text-md-end">
            <!-- กลุ่มปุ่มกดเลือกธาตุ -->
            <div class="btn-group flex-wrap" role="group" id="elementFilterGroup">
                <button type="button" class="btn btn-outline-warning active" data-element="All">ทั้งหมด</button>
                <button type="button" class="btn btn-outline-warning" data-element="Light">Light (แสง)</button>
                <button type="button" class="btn btn-outline-danger" data-element="Fire">Fire (ไฟ)</button>
                <button type="button" class="btn btn-outline-purple" data-element="Dark">Dark (มืด)</button>
            </div>
        </div>
    </div>
</section>
            </div>
        </section>

        <!-- แสดงการ์ดตัวละคร (Hero Grid) -->
        <section id="heroGrid" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">
            <!-- โค้ดจะถูกสร้างและแสดงผลผ่าน app.js -->
        </section>
    </main>

    <!-- Bootstrap 5 Modal สำหรับแสดงรายละเอียดตัวละคร -->
    <div class="modal fade" id="heroModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark text-light border-warning shadow-lg">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title text-warning fw-bold" id="modalHeroName">รายละเอียดตัวละคร</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="modalBody">
                    <!-- ข้อมูลสกิลจะถูกโหลดมาใส่ตรงนี้ -->
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- ไฟล์ข้อมูลและสคริปต์หลัก -->
    <script src="heroesData.js"></script>
    <script src="app.js"></script>
</body>
</html>
