<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guild War Formation - Seven Knights</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;700&family=Prompt:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #121212;
            color: #f8f9fa;
        }
        h1, h2, h3, h5 {
            font-family: 'Kanit', sans-serif;
        }
        /* ดีไซน์กระดานจัดทีมสไตล์ Guild War */
        .formation-board {
            background: linear-gradient(145deg, #1e1e2f, #2a2a40);
            border: 2px solid #4a4ae2;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
            max-width: 850px;
            margin: 0 auto;
        }
        .slot-box {
            width: 80px;
            height: 100px;
            border: 2px dashed rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.2);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }
        .slot-box:hover {
            border-color: #ffc107;
            background: rgba(255, 193, 7, 0.1);
        }
        .slot-box.filled {
            border-style: solid;
            border-color: #28a745;
            background: rgba(40, 167, 69, 0.2);
        }
        .pet-slot {
            width: 90px;
            height: 110px;
            border: 2px dashed #ffc107;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 193, 7, 0.05);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .pet-slot:hover {
            background: rgba(255, 193, 7, 0.15);
        }
        .zone-label {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.85rem;
            font-family: 'Kanit', sans-serif;
        }
        .badge-front { background-color: #dc3545; color: white; }
        .badge-back { background-color: #0d6efd; color: white; }
        
        /* การ์ดเลือกแผนใน Modal แบบเล็กๆ */
        .formation-card-option {
            border: 2px solid #444;
            background: #1a1a2e;
            transition: all 0.2s;
            cursor: pointer;
        }
        .formation-card-option:hover {
            border-color: #ffc107;
            background: #252542;
        }
    </style>
</head>
<body class="py-4">

    <div class="container">
        <!-- หัวข้อหน้าเว็บ และปุ่มเลือกแผน -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="text-warning fw-bold m-0">🛡️ จัดทีมกิลด์วอ (Guild War)</h3>
            <div class="d-flex gap-2">
                <button class="btn btn-warning btn-sm fw-bold px-3 shadow-sm" data-bs-toggle="modal" data-bs-target="#formationModal">
                    ⚙️ เปลี่ยนแผน (<span id="currentFormText">หน้า 2 / หลัง 3</span>)
                </button>
                <a href="index.html" class="btn btn-outline-light btn-sm">🏠 หน้าแรก</a>
            </div>
        </div>

        <!-- กระดานจัดทีมหลัก (UI กลางจอ) -->
        <div class="formation-board p-4">
            <div class="row align-items-center">
                
                <!-- ฝั่งซ้าย: ช่องตัวละคร แถวหลังและแถวหน้า -->
                <div class="col-lg-9 col-md-8 border-end border-secondary pe-lg-4">
                    
                    <!-- แถวหลัง (Back Line - B) -->
                    <div class="d-flex align-items-center justify-content-between mb-3 p-2 rounded bg-black bg-opacity-25 border border-secondary">
                        <div class="zone-label badge-back">B</div>
                        <div id="backSlots" class="d-flex gap-2 justify-content-center flex-grow-1">
                            <!-- สร้างด้วย JavaScript -->
                        </div>
                    </div>

                    <!-- แถวหน้า (Front Line - F) -->
                    <div class="d-flex align-items-center justify-content-between p-2 rounded bg-black bg-opacity-25 border border-secondary">
                        <div class="zone-label badge-front">F</div>
                        <div id="frontSlots" class="d-flex gap-2 justify-content-center flex-grow-1">
                            <!-- สร้างด้วย JavaScript -->
                        </div>
                    </div>

                </div>

                <!-- ฝั่งขวา: ช่องสัตว์เลี้ยง (Pet) -->
                <div class="col-lg-3 col-md-4 text-center mt-3 mt-md-0 ps-lg-3">
                    <span class="small text-warning fw-bold d-block mb-2">🐾 สัตว์เลี้ยงประจำทีม</span>
                    <div class="d-flex justify-content-center">
                        <div id="petSlot" class="pet-slot" onclick="openPetSelector()">
                            <span class="text-muted small text-center">+ เลือก<br>สัตว์เลี้ยง</span>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Modal เลือกแผนกลยุทธ์ (4 แผนในจอเดียว) -->
    <div class="modal fade" id="formationModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark text-light border-secondary">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title text-warning">เลือกแผนกลยุทธ์ (Formation)</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="row g-2">
                        <div class="col-6">
                            <div class="p-3 rounded formation-card-option text-center" onclick="changeFormation('2-3', 'หน้า 2 / หลัง 3')">
                                <h6 class="text-info fw-bold mb-1">หน้า 2 / หลัง 3</h6>
                                <p class="text-muted small mb-0">มาตรฐานสมดุล</p>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="p-3 rounded formation-card-option text-center" onclick="changeFormation('3-2', 'หน้า 3 / หลัง 2')">
                                <h6 class="text-info fw-bold mb-1">หน้า 3 / หลัง 2</h6>
                                <p class="text-muted small mb-0">เน้นหน้าหนา</p>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="p-3 rounded formation-card-option text-center" onclick="changeFormation('1-4', 'หน้า 1 / หลัง 4')">
                                <h6 class="text-info fw-bold mb-1">หน้า 1 / หลัง 4</h6>
                                <p class="text-muted small mb-0">ดาเมจหลังเต็มพิกัด</p>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="p-3 rounded formation-card-option text-center" onclick="changeFormation('4-1', 'หน้า 4 / หลัง 1')">
                                <h6 class="text-info fw-bold mb-1">หน้า 4 / หลัง 1</h6>
                                <p class="text-muted small mb-0">แทงค์หน้า 4 ตัว</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal เลือกตัวละคร -->
    <div class="modal fade" id="selectHeroModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark text-light border-secondary">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title text-warning">เลือกตัวละครลงตำแหน่ง</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="heroListContainer" class="row g-2">
                        <!-- รายการฮีโร่ -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal เลือกสัตว์เลี้ยง -->
    <div class="modal fade" id="selectPetModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark text-light border-secondary">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title text-warning">เลือกสัตว์เลี้ยงประจำทีม</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="petListContainer" class="row g-2">
                        <!-- รายการสัตว์เลี้ยง -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // ข้อมูลตัวละครจำลอง
        const availableHeroes = [
            { id: 1, name: "ยูภกอน", image: "https://i.pinimg.com/originals/a0/bf/df/a0bfdf887e50c451675beec0f7d5c9c1.png" },
            { id: 2, name: "โดยอง", image: "https://i.pinimg.com/originals/a0/bf/df/a0bfdf887e50c451675beec0f7d5c9c1.png" },
            { id: 3, name: "อีจูฮี", image: "https://i.pinimg.com/originals/a0/bf/df/a0bfdf887e50c451675beec0f7d5c9c1.png" }
        ];

        // ข้อมูลสัตว์เลี้ยงจำลอง
        const availablePets = [
            { id: 101, name: "จิ้งจอกเพลิง", image: "https://i.pinimg.com/originals/a0/bf/df/a0bfdf887e50c451675beec0f7d5c9c1.png" },
            { id: 102, name: "มังกรน้อย", image: "https://i.pinimg.com/originals/a0/bf/df/a0bfdf887e50c451675beec0f7d5c9c1.png" }
        ];

        let currentFormation = "2-3";
        let teamData = { front: [null, null], back: [null, null, null] };
        let selectedPet = null;
        let activeTargetSlot = null;

        const heroModal = new bootstrap.Modal(document.getElementById('selectHeroModal'));
        const petModal = new bootstrap.Modal(document.getElementById('selectPetModal'));
        const formationModalInstance = new bootstrap.Modal(document.getElementById('formationModal'));

        // ฟังก์ชันเปลี่ยนแผน
        function changeFormation(formKey, formText) {
            currentFormation = formKey;
            document.getElementById('currentFormText').innerText = formText;
            formationModalInstance.hide();
            renderBoard();
        }

        // วาดกระดาน
        function renderBoard() {
            const frontContainer = document.getElementById('frontSlots');
            const backContainer = document.getElementById('backSlots');
            
            frontContainer.innerHTML = '';
            backContainer.innerHTML = '';

            let frontCount = 2, backCount = 3;
            if (currentFormation === "3-2") { frontCount = 3; backCount = 2; }
            if (currentFormation === "1-4") { frontCount = 1; backCount = 4; }
            if (currentFormation === "4-1") { frontCount = 4; backCount = 1; }

            teamData.front = Array(frontCount).fill(null);
            teamData.back = Array(backCount).fill(null);

            for (let i = 0; i < backCount; i++) {
                backContainer.appendChild(createSlotElement('back', i));
            }
            for (let i = 0; i < frontCount; i++) {
                frontContainer.appendChild(createSlotElement('front', i));
            }

            renderPetSlot();
        }

        function createSlotElement(line, index) {
            const slot = document.createElement('div');
            slot.className = 'slot-box';
            
            const hero = teamData[line][index];
            if (hero) {
                slot.classList.add('filled');
                slot.innerHTML = `<img src="${hero.image}" class="img-fluid rounded" style="max-height: 85px;" alt="${hero.name}">`;
            } else {
                slot.innerHTML = `<span class="text-muted small">+ เลือก</span>`;
            }

            slot.onclick = () => {
                activeTargetSlot = { line, index };
                openHeroSelector();
            };

            return slot;
        }

        function renderPetSlot() {
            const petContainer = document.getElementById('petSlot');
            if (selectedPet) {
                petContainer.className = 'pet-slot border-solid bg-success bg-opacity-25';
                petContainer.innerHTML = `<img src="${selectedPet.image}" class="img-fluid rounded" style="max-height: 95px;" alt="${selectedPet.name}">`;
            } else {
                petContainer.className = 'pet-slot';
                petContainer.innerHTML = `<span class="text-muted small text-center">+ เลือก<br>สัตว์เลี้ยง</span>`;
            }
        }

        function openHeroSelector() {
            const container = document.getElementById('heroListContainer');
            let html = `
                <div class="col-12 mb-2">
                    <button class="btn btn-outline-danger w-100 btn-sm" onclick="removeHeroFromSlot()">❌ เอาตัวละครออก</button>
                </div>
            `;
            availableHeroes.forEach(hero => {
                html += `
                    <div class="col-4 text-center">
                        <div class="card bg-secondary text-light p-2 border-0 shadow-sm" style="cursor: pointer;" onclick="selectHero(${hero.id})">
                            <img src="${hero.image}" class="img-fluid rounded mb-1" style="max-height: 65px;">
                            <span class="small fw-bold text-truncate">${hero.name}</span>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
            heroModal.show();
        }

        function selectHero(heroId) {
            const hero = availableHeroes.find(h => h.id === heroId);
            if (activeTargetSlot) {
                teamData[activeTargetSlot.line][activeTargetSlot.index] = hero;
                renderBoard();
                heroModal.hide();
            }
        }

        function removeHeroFromSlot() {
            if (activeTargetSlot) {
                teamData[activeTargetSlot.line][activeTargetSlot.index] = null;
                renderBoard();
                heroModal.hide();
            }
        }

        function openPetSelector() {
            const container = document.getElementById('petListContainer');
            let html = `
                <div class="col-12 mb-2">
                    <button class="btn btn-outline-danger w-100 btn-sm" onclick="removePet()">❌ ถอดสัตว์เลี้ยง</button>
                </div>
            `;
            availablePets.forEach(pet => {
                html += `
                    <div class="col-6 text-center">
                        <div class="card bg-secondary text-light p-2 border-0 shadow-sm" style="cursor: pointer;" onclick="selectPet(${pet.id})">
                            <img src="${pet.image}" class="img-fluid rounded mb-1" style="max-height: 65px;">
                            <span class="small fw-bold text-truncate">${pet.name}</span>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
            petModal.show();
        }

        function selectPet(petId) {
            selectedPet = availablePets.find(p => p.id === petId);
            renderPetSlot();
            petModal.hide();
        }

        function removePet() {
            selectedPet = null;
            renderPetSlot();
            petModal.hide();
        }

        // รันครั้งแรก
        renderBoard();
    </script>
</body>
</html>
