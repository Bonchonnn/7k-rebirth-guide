<!DOCTYPE html>
<html lang="th">
<head>
    <link rel="icon" type="image/png" href="images/favicon-7k-war.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guild War Target Viewer - Seven Knights Re:Birth</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;700;800&family=Prompt:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body, html {
            height: 100%; margin: 0;
            font-family: 'Prompt', sans-serif;
            overflow-x: hidden; background-color: #0f0803;
        }

        .bg-infinity-castle {
            background: linear-gradient(rgba(15, 8, 3, 0.65), rgba(15, 8, 3, 0.75)),
                        url('images/Bg.jpg') no-repeat center center fixed;
            background-size: cover; min-height: 100vh; position: relative;
        }

        .blur-overlay {
            min-height: 100vh; backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px); padding-bottom: 50px;
        }

        h1, h2, h3, h4, h5, h6 { font-family: 'Kanit', sans-serif; }

        .btn-home {
            font-family: 'Kanit', sans-serif; font-weight: 600;
            background: linear-gradient(135deg, #10B981 0%, #059669 100%);
            border: 2px solid #6EE7B7; color: #fff; padding: 6px 18px; border-radius: 50px;
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.5); text-decoration: none;
            display: inline-flex; align-items: center; gap: 6px;
        }
        .btn-home:hover { color: #0f0803; background: #34D399; }

        .btn-dashboard {
            font-family: 'Kanit', sans-serif; font-weight: 600;
            background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%);
            border: 2px solid #FFE066; color: #fff; padding: 6px 18px; border-radius: 50px;
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.5); text-decoration: none;
            display: inline-flex; align-items: center; gap: 6px;
        }
        .btn-dashboard:hover { color: #0f0803; background: #FFE066; }

        /* การ์ดบ้านศัตรู (สไตล์การ์ดในรูป) */
        .enemy-target-card {
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid #e5e7eb;
            border-radius: 18px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            color: #1f2937;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .enemy-target-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 30px rgba(239, 68, 68, 0.3);
            border-color: #ef4444;
        }

        /* ช่องตัวละครจิ๋ว */
        .view-hero-slot {
            width: 55px; height: 70px; border: 2px solid #9ca3af;
            border-radius: 8px; display: flex; align-items: center;
            justify-content: center; background: rgba(243, 244, 246, 0.9);
            overflow: hidden; position: relative;
        }
        .front-slot { border-color: #ef4444; }
        .back-slot { border-color: #3b82f6; }

        .view-ring-thumb {
            width: 20px; height: 20px; border-radius: 50%;
            border: 1px solid #f59e0b; background: #fef3c7;
            object-fit: cover; position: absolute; bottom: 2px; right: 2px;
        }
        .view-pet-slot {
            width: 55px; height: 70px; border: 2px solid #f59e0b;
            border-radius: 10px; display: flex; align-items: center;
            justify-content: center; background: #fef3c7; overflow: hidden;
        }

        .zone-label {
            width: 22px; height: 22px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: 0.65rem; font-family: 'Kanit', sans-serif; color: white;
        }
        .badge-front { background-color: #ef4444; }
        .badge-back { background-color: #3b82f6; }

        /* การ์ดทีมแก้ใน Popup Modal */
        .counter-team-box {
            background: #ffffff;
            border: 2px solid #10b981;
            border-radius: 14px;
            color: #1f2937;
        }
    </style>
</head>

                    </h3>
                    <small class="text-light opacity-75">คลิกที่การ์ดเพื่อดูบ้านและทีมที่เราจัดไว้เข้าตี</small>
                </div>
                <div class="d-flex gap-2 align-items-center">
                    <a href="guildwar.html" class="btn-dashboard">⚙️ หน้าจัดบ้าน (Dashboard)</a>
                    <a href="index.html" class="btn-home">🏠 หน้าแรก</a>
                </div>
            </div>

            <!-- Grid แสดงรายการการ์ดบ้านศัตรู -->
            <div id="targetGridContainer" class="row g-4">
                <!-- ข้อมูลจะถูก render ที่นี่ -->
            </div>

        </div>
    </div>
