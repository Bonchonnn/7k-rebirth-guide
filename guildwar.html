<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guild War Formation - Seven Knights</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;700&family=Prompt:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Prompt', sans-serif;
            overflow-x: hidden;
            background-color: #0f0803;
        }

        /* รูปพื้นหลังเดียวกับหน้า index.html */
        .bg-infinity-castle {
            background: linear-gradient(rgba(15, 8, 3, 0.65), rgba(15, 8, 3, 0.75)),
                        url('images/Bg.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            position: relative;
        }

        /* แผ่นกระจกเบลอพื้นหลัง 5% เท่ากัน */
        .blur-overlay {
            min-height: 100vh;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }

        h1, h2, h3, h5 {
            font-family: 'Kanit', sans-serif;
        }

        /* กระดานจัดทีมตรงกลาง: พื้นหลังสีขาวความจาง 90% */
        .formation-board {
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid #d1d5db;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            max-width: 850px;
            margin: 0 auto;
            color: #1f2937;
        }

        .slot-box {
            width: 80px;
            height: 100px;
            border: 2px dashed #9ca3af;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(243, 244, 246, 0.8);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }
        .slot-box:hover {
            border-color: #f59e0b;
            background: rgba(254, 243, 199, 0.8);
        }
        .slot-box.filled {
            border-style: solid;
            border-color: #10b981;
            background: rgba(209, 250, 229, 0.9);
        }

        .pet-slot {
            width: 90px;
            height: 110px;
            border: 2px dashed #f59e0b;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(254, 243, 199, 0.8);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .pet-slot:hover {
            background: rgba(253, 230, 138, 0.9);
        }

        .zone-label {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.85rem;
            font-family: 'Kanit', sans-serif;
        }
        .badge-front { background-color: #ef4444; color: white; }
        .badge-back { background-color: #3b82f6; color: white; }
        
        /* การ์ดเลือกแผนใน Modal */
        .formation-card-option {
            border: 2px solid #444;
            background: #1a1a2e;
            color: #fff;
            transition: all 0.2s;
            cursor: pointer;
        }
        .formation-card-option:hover {
            border-color: #ffc107;
            background: #252542;
        }
    </style>
</head>
<body class="bg-infinity-castle text-light">

    <!-- ชั้น Blur Overlay เบลอพื้นหลัง 5% -->
    <div class="blur-overlay py-4">
        <div class="container">
            <!-- หัวข้อหน้าเว็บ และปุ่มเลือกแผน -->
            <div class="d-flex justify-content-between align-items-center mb-4 px-2">
                <h3 class="text-warning fw-bold m-0" style="text-shadow: 0 0 10px rgba(0,0,0,0.8);">🛡️ จัดทีมกิลด์วอ (Guild War)</h3>
                <div class="d-flex gap-2">
                    <button class="btn btn-warning btn-sm fw-bold px-3 shadow-sm" data-bs-toggle="modal" data-bs-target="#formationModal">
                        ⚙️ เปลี่ยนแผน (<span id="currentFormText">หน้า 2 / หลัง 3</span>)
                    </button>
                    <a href="index.html" class="btn btn-outline-light btn-sm shadow-sm">🏠 หน้าแรก</a>
                </div>
            </div>

            <!-- กระดานจัดทีมหลัก (พื้นหลังสีขาวความจาง 90%) -->
            <div class="formation-board p-4">
                <div class="row align-items-center">
                    
                    <!-- ฝั่งซ้าย: ช่องตัวละคร แถวหลังและแถวหน้า -->
                    <div class="col-lg-9 col-md-8 border-end border-secondary-subtle pe-lg-4">
                        
                        <!-- แถวหลัง (Back Line - B) -->
                        <div class="d-flex align-items-center justify-content-between mb-3 p-2 rounded bg-white
