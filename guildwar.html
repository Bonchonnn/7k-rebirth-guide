<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guild War Formation - Seven Knights</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;700;800&family=Prompt:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Prompt', sans-serif;
            overflow-x: hidden;
            background-color: #0f0803;
        }

        /* รูปพื้นหลังดึงจากภาพที่อัปโหลด */
        .bg-infinity-castle {
            background: linear-gradient(rgba(15, 8, 3, 0.65), rgba(15, 8, 3, 0.75)),
                        url('images/Bg.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            position: relative;
        }

        /* แผ่นกระจกเบลอพื้นหลัง 5% (เท่ากับหน้าแรก) */
        .blur-overlay {
            min-height: 100vh;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }

        h1, h2, h3, h5, h6 {
            font-family: 'Kanit', sans-serif;
        }

        /* ปุ่มกลับหน้าแรก */
        .btn-home {
            font-family: 'Kanit', sans-serif;
            font-weight: 600;
            background: linear-gradient(135deg, #10B981 0%, #059669 100%);
            border: 2px solid #6EE7B7;
            color: #fff;
            padding: 6px 18px;
            border-radius: 50px;
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.5);
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-home:hover {
            background: linear-gradient(135deg, #34D399 0%, #10B981 100%);
            color: #0f0803;
            box-shadow: 0 0 20px rgba(110, 231, 183, 0.8);
            transform: translateY(-2px);
        }

        /* ปุ่มเปลี่ยนแผน */
        .btn-formation {
            font-family: 'Kanit', sans-serif;
            font-weight: 600;
            background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%);
            border: 2px solid #FFE066;
            color: #fff;
            padding: 6px 18px;
            border-radius: 50px;
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.5);
            transition: all 0.3s ease;
        }

        .btn-formation:hover {
            background: linear-gradient(135deg, #FFE066 0%, #F59E0B 100%);
            color: #0f0803;
            box-shadow: 0 0 20px rgba(255, 224, 102, 0.8);
            transform: translateY(-2px);
        }

        /* กระดานจัดทีมตรงกลาง: พื้นหลังสีขาวความจาง 80% */
        .formation-board {
            background: rgba(255, 255, 255, 0.8);
            border: 2px solid #e5e7eb;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            max-width: 850px;
            margin: 0 auto;
            color: #1f2937;
        }

        /* ช่องใส่ตัวละคร */
        .slot-box {
            width: 75px;
            height: 95px;
            border: 2px dashed #9ca3af;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(243, 244, 246, 0.9);
            cursor: pointer;
            transition: all 0.25s ease;
            user-select: none;
        }

        .slot-box:hover {
            border-color: #f59e0b;
            background: #fef3c7;
            transform: scale(1.03);
        }

        .slot-box.filled {
            border-style: solid;
            border-color: #10b981;
            background: #d1fae5;
        }

        /* ช่องใส่สัตว์เลี้ยง */
        .pet-slot {
            width: 90px;
            height: 110px;
            border: 2px dashed #f59e0b;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fef3c7;
            cursor: pointer;
            transition: all 0.25s ease;
            user-select: none;
        }

        .pet-slot:hover {
            background: #fde68a;
            transform: scale(1.03);
        }

        .zone-label {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 0.9rem;
            font-family: 'Kanit', sans-serif;
            flex-shrink: 0;
        }

        .badge-front { background-color: #ef4444; color: white; box-shadow: 0 2px 8px rgba(239, 68, 68, 0.4); }
        .badge-back { background-color: #3b82f6; color: white; box-shadow: 0 2px 8px rgba(59, 130, 246, 0.4); }

        /* การ์ดเลือกแผนใน Modal */
        .formation-card-option {
            border: 2px solid #374151;
            background: #1f2937;
            color: #fff;
            transition: all 0.2s;
            cursor: pointer;
        }

        .formation-card-option:hover {
            border-color: #f59e0b;
            background: #374151;
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="bg-infinity-castle text-light">

    <!-- ชั้น Blur Overlay เบลอพื้นหลัง 5% -->
    <div class="blur-overlay py-4">
        <div class="container">
            
            <!-- หัวข้อหน้าเว็บ และปุ่มเมนู -->
            <div class="d-flex justify-content-between align-items-center mb-4 px-2">
                <h3 class="text-warning fw-bold m-0" style="text-shadow: 0 0 12px rgba(245, 158, 11, 0.6);">
                    🛡️ จัดทีมกิลด์วอ (Guild War)
                </h3>
                <div class="d-flex gap-2 align-items-center">
                    <button class="btn btn-formation btn-sm shadow" data-bs-toggle="modal" data-bs-target="#formationModal">
                        ⚙️ เปลี่ยนแผน (<span id="currentFormText">หน้า 2 / หลัง 3</span>)
                    </button>
                    <a href="index.html" class="btn-home">
                        🏠 หน้าแรก
                    </a>
                </div>
            </div>

            <!-- กระดานจัดทีมหลัก (พื้นหลังสีขาวความจาง 80%) -->
            <div class="formation-board p-4">
                <div class="row align-items-center g-3">
                    
                    <!-- ฝั่งซ้าย: ช่องตัวละคร (แถวหลัง B และแถวหน้า F) -->
                    <div class="col-md-9 border-end-md pe-md-4">
                        
                        <!-- แถวหลัง (Back Line - B) -->
                        <div class="mb-3 p-3 rounded bg-white border shadow-sm">
                            <div class="d-flex align-items-center gap-3">
                                <div class="zone-label badge-back">B</div>
                                <div id="backSlots" class="d-flex gap-2 justify-content-center flex-grow-1 flex-wrap">
                                    <!-- สร้างช่องด้วย JS -->
                                </div>
                            </div>
                        </div>

                        <!-- แถวหน้า (Front Line - F) -->
                        <div class="p-3 rounded bg-white border shadow-sm">
                            <div class="d-flex align-items-center gap-3">
                                <div class="zone-label badge-front">F</div>
                                <div id="frontSlots" class="d-flex gap-2 justify-content-center flex-grow-1 flex-wrap">
                                    <!-- สร้างช่องด้วย JS -->
                                </div>
                            </div>
                        </div>

                    </div>

                    <!-- ฝั่งขวา: ช่องสัตว์เลี้ยง (Pet) -->
                    <div class="col-md-3 text-center">
                        <span class="small text-dark fw-bold d-block mb-2">🐾 สัตว์เลี้ยงประจำทีม</span>
                        <div class="d-flex justify-content-center">
                            <div id="petSlot" class="pet-slot shadow-sm" onclick="openPetSelector()">
                                <span class="text-muted small text-center">+ เลือก<br>สัตว์เลี้ยง</span>
                            </div>
                        </div>
                    </div>

                </div>
            </div>

        </div>
    </div>

    <!-- Modal เลือกแผนกลยุทธ์ -->
    <div class="modal fade" id="formationModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark text-light border-secondary shadow-lg">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title text-warning fw-bold">เลือกแผนกลยุทธ์ (Formation)</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="row g-2">
                        <div class="col-6">
                            <div class="p-3 rounded formation-card-option text-center" onclick="changeFormation('2-3', 'หน้า 2 / หลัง 3')">
                                <h6 class="text-info fw-bold mb-1">หน้า 2 / หลัง 3</h6>
                                <p class="text-muted small mb-0">มาตรฐานสมดุล</p>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="p-3 rounded formation-card-option text-center" onclick="changeFormation('3-2', 'หน้า 3 / หลัง 2')">
                                <h6 class="text-info fw-bold mb-1">หน้า 3 / หลัง 2</h6>
                                <p class="text-muted small mb-0">เน้นหน้าหนา</p>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="p-3 rounded formation-card-option text-center" onclick="changeFormation('1-4', 'หน้า 1 / หลัง 4')">
                                <h6 class="text-info fw-bold mb-1">หน้า 1 / หลัง 4</h6>
                                <p class="text-muted small mb-0">ดาเมจหลังเต็มพิกัด</p>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="p-3 rounded formation-card-option text-center" onclick="changeFormation('4-1', 'หน้า 4 / หลัง 1')">
                                <h6 class="text-info fw-bold mb-1">หน้า 4 / หลัง 1</h6>
                                <p class="text-muted small mb-0">แทงค์หน้า 4 ตัว</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal เลือกตัวละคร -->
    <div class="modal fade" id="selectHeroModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark text-light border-secondary shadow-lg">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title text-warning fw-bold">เลือกตัวละครลงตำแหน่ง</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="heroListContainer" class="row g-2"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal เลือกสัตว์เลี้ยง -->
    <div class="modal fade" id="selectPetModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark text-light border-secondary shadow-lg">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title text-warning fw-bold">เลือกสัตว์เลี้ยงประจำทีม</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="petListContainer" class="row g-2"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const availableHeroes = [
            { id: 1, name: "กิยู", image: "images/Giyu&Shinobu.png" },
            { id: 2, name: "ชิโนบุ", image: "images/Giyu&Shinobu.png" },
            { id: 3, name: "ทันจิโร่", image: "images/Bg.jpg" }
        ];

        const availablePets = [
            { id: 101, name: "สัตว์เลี้ยง 1", image: "images/Giyu&Shinobu.png" },
            { id: 102, name: "สัตว์เลี้ยง 2", image: "images/Bg.jpg" }
        ];

        let currentFormation = "2-3";
        let teamData = { front: [null, null], back: [null, null, null] };
        let selectedPet = null;
        let activeTargetSlot = null;

        let heroModal, petModal, formationModalInstance;

        document.addEventListener("DOMContentLoaded", function() {
            heroModal = new bootstrap.Modal(document.getElementById('selectHeroModal'));
            petModal = new bootstrap.Modal(document.getElementById('selectPetModal'));
            formationModalInstance = new bootstrap.Modal(document.getElementById('formationModal'));
            
            renderBoard();
        });

        function changeFormation(formKey, formText) {
            currentFormation = formKey;
            document.getElementById('currentFormText').innerText = formText;
            if (formationModalInstance) formationModalInstance.hide();
            renderBoard();
        }

        function renderBoard() {
            const frontContainer = document.getElementById('frontSlots');
            const backContainer = document.getElementById('backSlots');
            
            if (!frontContainer || !backContainer) return;

            frontContainer.innerHTML = '';
            backContainer.innerHTML = '';

            let frontCount = 2, backCount = 3;
            if (currentFormation === "3-2") { frontCount = 3; backCount = 2; }
            if (currentFormation === "1-4") { frontCount = 1; backCount = 4; }
            if (currentFormation === "4-1") { frontCount = 4; backCount = 1; }

            teamData.front = Array(frontCount).fill(null);
            teamData.back = Array(backCount).fill(null);

            for (let i = 0; i < backCount; i++) {
                backContainer.appendChild(createSlotElement('back', i));
            }
            for (let i = 0; i < frontCount; i++) {
                frontContainer.appendChild(createSlotElement('front', i));
            }

            renderPetSlot();
        }

        function createSlotElement(line, index) {
            const slot = document.createElement('div');
            slot.className = 'slot-box';
            
            const hero = teamData[line][index];
            if (hero) {
                slot.classList.add('filled');
                slot.innerHTML = `<img src="${hero.image}" class="img-fluid rounded" style="max-height: 80px; object-fit: cover;" alt="${hero.name}">`;
            } else {
                slot.innerHTML = `<span class="text-muted small fw-bold">+ เลือก</span>`;
            }

            slot.onclick = () => {
                activeTargetSlot = { line, index };
                openHeroSelector();
            };

            return slot;
        }

        function renderPetSlot() {
            const petContainer = document.getElementById('petSlot');
            if (!petContainer) return;

            if (selectedPet) {
                petContainer.className = 'pet-slot border-solid bg-success bg-opacity-25';
                petContainer.innerHTML = `<img src="${selectedPet.image}" class="img-fluid rounded" style="max-height: 95px; object-fit: cover;" alt="${selectedPet.name}">`;
            } else {
                petContainer.className = 'pet-slot';
                petContainer.innerHTML = `<span class="text-muted small fw-bold text-center">+ เลือก<br>สัตว์เลี้ยง</span>`;
            }
        }

        function openHeroSelector() {
            const container = document.getElementById('heroListContainer');
            let html = `
                <div class="col-12 mb-2">
                    <button class="btn btn-outline-danger w-100 btn-sm" onclick="removeHeroFromSlot()">❌ เอาตัวละครออก</button>
                </div>
            `;
            availableHeroes.forEach(hero => {
                html += `
                    <div class="col-4 text-center">
                        <div class="card bg-secondary text-light p-2 border-0 shadow-sm" style="cursor: pointer;" onclick="selectHero(${hero.id})">
                            <img src="${hero.image}" class="img-fluid rounded mb-1" style="height: 65px; object-fit: cover;">
                            <span class="small fw-bold text-truncate d-block">${hero.name}</span>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
            heroModal.show();
        }

        function selectHero(heroId) {
            const hero = availableHeroes.find(h => h.id === heroId);
            if (activeTargetSlot) {
                teamData[activeTargetSlot.line][activeTargetSlot.index] = hero;
                renderBoard();
                heroModal.hide();
            }
        }

        function removeHeroFromSlot() {
            if (activeTargetSlot) {
                teamData[activeTargetSlot.line][activeTargetSlot.index] = null;
                renderBoard();
                heroModal.hide();
            }
        }

        function openPetSelector() {
            const container = document.getElementById('petListContainer');
            let html = `
                <div class="col-12 mb-2">
                    <button class="btn btn-outline-danger w-100 btn-sm" onclick="removePet()">❌ ถอดสัตว์เลี้ยง</button>
                </div>
            `;
            availablePets.forEach(pet => {
                html += `
                    <div class="col-6 text-center">
                        <div class="card bg-secondary text-light p-2 border-0 shadow-sm" style="cursor: pointer;" onclick="selectPet(${pet.id})">
                            <img src="${pet.image}" class="img-fluid rounded mb-1" style="height: 65px; object-fit: cover;">
                            <span class="small fw-bold text-truncate d-block">${pet.name}</span>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
            petModal.show();
        }

        function selectPet(petId) {
            selectedPet = availablePets.find(p => p.id === petId);
            renderPetSlot();
            petModal.hide();
        }

        function removePet() {
            selectedPet = null;
            renderPetSlot();
            petModal.hide();
        }
    </script>
</body>
</html>
