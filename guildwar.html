<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guild War Formation - Seven Knights</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;700&family=Prompt:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #121212;
            color: #f8f9fa;
        }
        h1, h2, h3 {
            font-family: 'Kanit', sans-serif;
        }
        /* ดีไซน์กระดานจัดทีมสไตล์ Guild War */
        .formation-board {
            background: linear-gradient(145deg, #1e1e2f, #2a2a40);
            border: 2px solid #4a4ae2;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
            max-width: 800px;
            margin: 0 auto;
        }
        .slot-box {
            width: 85px;
            height: 105px;
            border: 2px dashed rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.2);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }
        .slot-box:hover {
            border-color: #ffc107;
            background: rgba(255, 193, 7, 0.1);
        }
        .slot-box.filled {
            border-style: solid;
            border-color: #28a745;
            background: rgba(40, 167, 69, 0.2);
        }
        .zone-label {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-family: 'Kanit', sans-serif;
        }
        .badge-front { background-color: #dc3545; color: white; }
        .badge-back { background-color: #0d6efd; color: white; }
    </style>
</head>
<body class="py-5">

    <div class="container">
        <!-- หัวข้อหน้าเว็บ -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="text-warning fw-bold m-0">🛡️ จัดทีมกิลด์วอ (Guild War Formation)</h2>
            <a href="index.html" class="btn btn-outline-light btn-sm">🏠 กลับหน้าแรก</a>
        </div>

        <!-- ส่วนเลือกแผนกลยุทธ์ Formation -->
        <div class="card bg-dark border-secondary mb-4 p-3 shadow">
            <label class="form-label text-info fw-bold mb-2">📌 เลือกแผนกลยุทธ์ Formation:</label>
            <div class="btn-group w-100" role="group" id="formationSelector">
                <button type="button" class="btn btn-outline-primary active" data-form="2-3">หน้า 2 / หลัง 3 (Standard)</button>
                <button type="button" class="btn btn-outline-primary" data-form="3-2">หน้า 3 / หลัง 2 (Balanced)</button>
                <button type="button" class="btn btn-outline-primary" data-form="1-4">หน้า 1 / หลัง 4 (Back Attack)</button>
                <button type="button" class="btn btn-outline-primary" data-form="4-1">หน้า 4 / หลัง 1 (Front Tank)</button>
            </div>
        </div>

        <!-- กระดานจัดทีม (Field) -->
        <div class="formation-board p-4 text-center">
            
            <!-- แถวหลัง (Back Line - B) -->
            <div class="d-flex align-items-center justify-content-between mb-4 p-3 rounded bg-black bg-opacity-25 border border-secondary">
                <div class="zone-label badge-back">B</div>
                <div id="backSlots" class="d-flex gap-3 justify-content-center flex-grow-1">
                    <!-- ช่องตัวละครแถวหลังจะถูกสร้างด้วย JS -->
                </div>
            </div>

            <hr class="border-secondary">

            <!-- แถวหน้า (Front Line - F) -->
            <div class="d-flex align-items-center justify-content-between p-3 rounded bg-black bg-opacity-25 border border-secondary">
                <div class="zone-label badge-front">F</div>
                <div id="frontSlots" class="d-flex gap-3 justify-content-center flex-grow-1">
                    <!-- ช่องตัวละครแถวหน้าจะถูกสร้างด้วย JS -->
                </div>
            </div>

        </div>
    </div>

    <!-- Modal เลือกตัวละคร -->
    <div class="modal fade" id="selectHeroModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark text-light border-secondary">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title text-warning">เลือกตัวละครลงตำแหน่ง</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="heroListContainer" class="row g-2">
                        <!-- รายการตัวละครจะแสดงที่นี่ -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // ข้อมูลตัวละครจำลอง (สามารถดึงมาจากไฟล์ heroesData.js ได้)
        const availableHeroes = [
            { id: 1, name: "ยูภกอน", role: "เวทย์", image: "https://i.pinimg.com/originals/a0/bf/df/a0bfdf887e50c451675beec0f7d5c9c1.png" },
            { id: 2, name: "โดยอง", role: "สมดุล", image: "https://i.pinimg.com/originals/a0/bf/df/a0bfdf887e50c451675beec0f7d5c9c1.png" },
            { id: 3, name: "อีจูฮี", role: "สนับสนุน", image: "https://i.pinimg.com/originals/a0/bf/df/a0bfdf887e50c451675beec0f7d5c9c1.png" }
        ];

        let currentFormation = "2-3"; // ค่าเริ่มต้น หน้า 2 / หลัง 3
        let teamData = { front: [null, null], back: [null, null, null] };
        let activeTargetSlot = null; // เก็บข้อมูลว่ากำลังคลิกช่องไหนอยู่ {line: 'front', index: 0}

        const modal = new bootstrap.Modal(document.getElementById('selectHeroModal'));

        // ฟังก์ชันสร้างช่องว่างตามแผนที่เลือก
        function renderBoard() {
            const frontContainer = document.getElementById('frontSlots');
            const backContainer = document.getElementById('backSlots');
            
            frontContainer.innerHTML = '';
            backContainer.innerHTML = '';

            let frontCount = 2, backCount = 3;
            if (currentFormation === "3-2") { frontCount = 3; backCount = 2; }
            if (currentFormation === "1-4") { frontCount = 1; backCount = 4; }
            if (currentFormation === "4-1") { frontCount = 4; backCount = 1; }

            // ปรับขนาดอาเรย์ข้อมูลทีมตามจำนวนช่อง
            teamData.front = Array(frontCount).fill(null);
            teamData.back = Array(backCount).fill(null);

            // สร้างช่องแถวหลัง (Back)
            for (let i = 0; i < backCount; i++) {
                backContainer.appendChild(createSlotElement('back', i));
            }
            // สร้างช่องแถวหน้า (Front)
            for (let i = 0; i < frontCount; i++) {
                frontContainer.appendChild(createSlotElement('front', i));
            }
        }

        // สร้าง Element แต่ละช่อง
        function createSlotElement(line, index) {
            const slot = document.createElement('div');
            slot.className = 'slot-box';
            
            const hero = teamData[line][index];
            if (hero) {
                slot.classList.add('filled');
                slot.innerHTML = `<img src="${hero.image}" class="img-fluid rounded" style="max-height: 90px;" alt="${hero.name}">`;
            } else {
                slot.innerHTML = `<span class="text-muted small">+ เลือก</span>`;
            }

            // คลิกเพื่อเปิด Modal เลือกตัวละคร
            slot.onclick = () => {
                activeTargetSlot = { line, index };
                openHeroSelector();
            };

            return slot;
        }

        // เปิด Modal เลือกฮีโร่
        function openHeroSelector() {
            const container = document.getElementById('heroListContainer');
            container.innerHTML = '';

            // เพิ่มปุ่มลบตัวละครออกด้วย
            let html = `
                <div class="col-12 mb-2">
                    <button class="btn btn-outline-danger w-100 btn-sm" onclick="removeHeroFromSlot()">❌ เอาตัวละครออก</button>
                </div>
            `;

            availableHeroes.forEach(hero => {
                html += `
                    <div class="col-4 text-center">
                        <div class="card bg-secondary text-light p-2 border-0 shadow-sm" style="cursor: pointer;" onclick="selectHero(${hero.id})">
                            <img src="${hero.image}" class="img-fluid rounded mb-1" style="max-height: 70px;">
                            <span class="small fw-bold text-truncate">${hero.name}</span>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
            modal.show();
        }

        // เลือกตัวละครใส่ลงช่อง
        function selectHero(heroId) {
            const hero = availableHeroes.find(h => h.id === heroId);
            if (activeTargetSlot) {
                teamData[activeTargetSlot.line][activeTargetSlot.index] = hero;
                renderBoard();
                modal.hide();
            }
        }

        // เอาตัวละครออกจากช่อง
        function removeHeroFromSlot() {
            if (activeTargetSlot) {
                teamData[activeTargetSlot.line][activeTargetSlot.index] = null;
                renderBoard();
                modal.hide();
            }
        }

        // Event เปลี่ยนแผน Formation
        document.querySelectorAll('#formationSelector button').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('#formationSelector button').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentFormation = e.target.getAttribute('data-form');
                renderBoard();
            });
        });

        // รันครั้งแรก
        renderBoard();
    </script>
</body>
</html>
